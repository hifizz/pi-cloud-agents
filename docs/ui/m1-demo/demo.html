</style></head><body><div id="app"></div>
<script type="module">
/* components/shared.mjs */
const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(name, size=16) {
  const paths={plus:'M12 5v14M5 12h14',search:'m21 21-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',branch:'M6 8v9a3 3 0 0 0 3 3h5a4 4 0 0 0 4-4V8M6 2v2m12-2v2M3 6a3 3 0 1 0 6 0 3 3 0 0 0-6 0m12 0a3 3 0 1 0 6 0 3 3 0 0 0-6 0',box:'m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 10v9M3 8l9 5 9-5M8 5l9 5',chevron:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6',file:'M14 2H5v20h14V7l-5-5Zm0 0v6h5',terminal:'m4 5 6 7-6 7m9 0h7',panel:'M3 3h18v18H3V3Zm10 0v18',stop:'M6 6h12v12H6z',arrow:'M12 20V4m-6 6 6-6 6 6',close:'m6 6 12 12M6 18 18 6',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',git:'m7 7 10 10M7 7h8m-8 0v8',folder:'M3 6h7l2 2h9v12H3V6Z',save:'M5 3h12l4 4v14H3V3h2Zm2 0v6h10V3M7 21v-8h10v8',refresh:'M20 7a9 9 0 1 0 1 8M20 2v6h-6',settings:'M4 7h16M4 17h16M8 4v6m8 4v6',chat:'M3 4h18v13H9l-6 4V4Z'};
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
}
const modelOptions = ['SWE-2','GLM 5.3','GPT-6.1-sol'];
function statusInfo(s){
 if(s.workspace.step<5) return {label:'正在准备环境',tone:'warn',detail:'初始化步骤可接续'};
 return ({running:{label:'执行中',tone:'accent',detail:'正在运行回归检查'},approval:{label:'等待审批',tone:'warn',detail:'推送分支需要你的批准'},review:{label:'待验收',tone:'ok',detail:'后续交付态 · 演示结果'},stopping:{label:'停止待确认',tone:'warn',detail:'已请求停止，等待执行端确认'},stopped:{label:'已停止',tone:'muted',detail:'执行端已确认 · 本地模拟'},denied:{label:'审批已拒绝',tone:'muted',detail:'推送未执行 · 本地模拟'}})[s.scenario];
}

/* components/tool-card.mjs */
function ToolCard(s){const running=s.scenario==='running';return `<div class="tool-group"><button class="tool-summary" data-action="tools" aria-expanded="${s.toolsOpen}"><span class="chevron ${s.toolsOpen?'open':''}">${icon('chevron',13)}</span>${icon('terminal',14)}<span>检查恢复逻辑，更新 2 个文件</span><span class="tiny muted">3 步 · 24s</span></button>${s.toolsOpen?`<div class="tool-details"><div><span class="ok">${icon('check',12)}</span><code>read src/runner/client.mjs</code><span class="muted">0.2s</span></div><div><span class="ok">${icon('check',12)}</span><code>edit web/src/lib/connection.ts</code><span class="muted">0.1s</span></div><pre aria-label="工具输出">$ node --test test/runner.test.mjs\n[演示日志] reconnect: attach to existing run\n[演示日志] duplicate process: prevented</pre></div>`:''}</div><button class="files-changed" data-action="changes">${icon('file',14)}<span>2 个文件已修改</span><span class="add">+28</span><span class="del">−7</span><span class="tiny muted">查看改动 ${icon('chevron',12)}</span></button>${running?`<div class="live-tool"><span class="spinner"></span><code>npm test</code><span class="muted">运行回归检查</span><button data-action="terminal">查看日志 ${icon('chevron',12)}</button></div>`:''}`;}
function Approval(s){return `<div class="approval-card"><div class="card-heading"><span class="warn">${icon('git',16)}</span><strong>批准推送工作分支？</strong><span class="tag">沿用现有审批</span></div><p>Agent 请求将当前改动推送到仓库。请核对目标后继续。</p><pre>git push origin ${escapeHtml(s.workspace.branch)}</pre><div class="approval-actions"><span class="tiny muted">仅本地模拟，不执行命令</span><button data-action="reject">拒绝</button><button class="primary" data-action="approve">批准本次操作</button></div></div>`;}

/* components/conversation.mjs */
function Conversation(s){const v=statusInfo(s);const preparing=s.workspace.step<5;return `<section class="conversation" role="log" aria-label="工作区会话"><div class="feed"><div class="feed-date"><span></span>今天 · 演示会话<span></span></div><div class="user-message"><div class="message-meta">你 <span>14:32</span></div><p>${escapeHtml(s.workspace.task||'刷新页面后，正在运行的命令结果没有接回来。请修复重连逻辑，避免重复执行，并补上回归测试。')}</p></div><article class="assistant-message"><div class="assistant-label"><span class="mini-brand">PI</span><strong>Agent</strong><span>${escapeHtml(s.model)}</span></div>${preparing?`<p>已创建工作区记录。环境初始化会按步骤推进，完成后开始处理你的需求。</p><div class="init-inline">${['分配独立 Sprite','初始化运行环境','检出仓库与分支','安装项目依赖','关联会话并开始任务'].map((label,i)=>`<div class="${i<s.workspace.step?'ok':i===s.workspace.step?'accent':'muted'}"><span>${i<s.workspace.step?icon('check',13):String(i+1).padStart(2,'0')}</span>${label}${i===s.workspace.step?'<span class="tag">当前步骤</span>':''}</div>`).join('')}</div><button class="primary" data-action="init-next">${s.workspace.step===4?'完成初始化（模拟）':'下一步（模拟）'}${icon('chevron',13)}</button>`:`<p>我会先检查连接恢复与执行编号的处理，再补一个“断线后接回”的回归用例。刷新只会重新附着现有运行。</p>${ToolCard(s)}${s.scenario==='approval'?Approval(s):s.scenario==='review'?`<div class="delivery-card"><div class="card-heading"><span class="ok">${icon('check',16)}</span><strong>修复已准备好供你检查</strong><span class="tag">M3 方案演示</span></div><p>重连时按原执行编号接回日志，保留断开前的输出位置；相同编号不会创建第二个进程。</p><div class="test-result"><span class="${s.testsStale?'warn':'ok'}">${icon(s.testsStale?'clock':'check',14)}${s.testsStale?'需要重新验证':'回归检查通过'}</span><span class="tiny muted">${s.testsStale?'需求已追加，旧结果已过期':'12 / 12 · 演示结果'}</span></div><div class="delivery-actions"><button data-action="changes">检查代码</button><button data-action="rerun" ${!s.testsStale?'disabled title="当前演示结果已是最新"':''}>重新验证（模拟）</button><button class="primary" data-action="pr">${s.prCreated?'查看示例 PR':'创建 PR（模拟）'}${icon('git',13)}</button></div>${s.prCreated?'<p class="inline-note">示例 PR 已生成 · 未访问 GitHub，无真实链接。</p>':''}</div>`:`<div class="activity-note"><span class="dot ${v.tone}"></span><span>${v.detail}</span>${s.scenario==='running'?'<span class="tiny muted">日志已接回 · 无重复执行</span>':''}${s.scenario==='stopping'?'<button data-action="confirm-stop">模拟收到停止确认</button>':''}</div>`}`}</article>${s.messages.map(m=>`<div class="user-message added"><div class="message-meta">你<span>${escapeHtml(m.mode)}</span></div><p>${escapeHtml(m.text)}</p></div><div class="local-response">${icon('check',13)}${m.mode==='下一轮'?'已加入下一轮队列':'已记录本轮补充'} · 本地演示</div>`).join('')}<div class="feed-end"></div></div></section>`;}

/* components/composer.mjs */
function Composer(s){const disabled=s.workspace.step<5;const busy=!disabled&&['running','approval','stopping'].includes(s.scenario);const v=statusInfo(s);return `<div class="composer-wrap"><div class="composer"><label class="sr-only" for="message-input">补充需求</label><textarea id="message-input" rows="2" placeholder="${disabled?'环境准备完成后即可发送…':busy?'补充方向，或把新需求放到下一轮…':'提出修改，继续这项工作…'}" ${disabled?'disabled':''}>${escapeHtml(s.draft)}</textarea><div class="composer-toolbar"><label class="model-select"><span class="model-mark">${s.model==='SWE-2'?'SW':s.model==='GLM 5.3'?'GL':'GP'}</span><select id="model-select" aria-label="模型">${modelOptions.map(m=>`<option ${m===s.model?'selected':''}>${m}</option>`).join('')}</select></label><span class="compose-hint">↵ 发送 · ⇧↵ 换行</span>${busy?`<button class="stop-button" data-action="stop" ${s.scenario==='stopping'?'disabled':''} title="发送停止请求后仍须等待执行端确认">${icon('stop',12)}${s.scenario==='stopping'?'待确认':'停止'}</button><button data-action="queue" ${disabled||!s.draft.trim()?'disabled':''}>下一轮</button>`:''}<button class="send-button" data-action="send" aria-label="${busy?'补充本轮':'发送'}" ${disabled||!s.draft.trim()?'disabled':''}>${busy?'补充本轮':''}${icon('arrow',15)}</button></div></div><div class="context-strip"><span>${icon('box',12)}${escapeHtml(s.workspace.sprite)}</span><span>${icon('folder',12)} /home/sprite/workspace</span></div><div class="composer-status"><span class="dot ${v.tone}"></span><span>${v.label}</span><span class="muted">${s.workspace.step<5?'初始化支持断点续接':'关闭页面后，云端任务继续运行'}</span><span class="local-label">原型交互均为本地模拟</span></div></div>`;}

/* components/sidebar.mjs */
function Sidebar(s){
 const q=s.search.toLowerCase();
 const rows=s.workspaces.filter(w=>w.name.toLowerCase().includes(q)).map(w=>`<button class="workspace ${s.active===w.id?'active':''}" data-action="workspace" data-id="${w.id}"><span class="workspace-top"><span class="dot ${w.id===s.active?statusInfo(s).tone:'accent'}"></span><span>${escapeHtml(w.name)}</span>${w.id!==s.active?'<span class="tiny muted">运行中</span>':''}</span><span class="workspace-branch">${icon('branch',12)}${escapeHtml(w.branch)}</span></button>${s.active===w.id?`<div class="sessions"><button class="session selected" data-action="session">${icon('chat',13)}${escapeHtml(w.session||'主会话')}<span class="tiny">当前</span></button><button class="session" disabled title="M2：工作区写锁就绪后开放第二会话">${icon('chat',13)}实现讨论<span class="tiny">M2</span></button></div>`:''}`).join('');
 return `<aside class="rail"><div class="brand"><span class="brand-mark">PI</span><strong>pi-cloud-agents</strong><button class="icon-button" data-action="toggle-rail" aria-label="收起侧栏">${icon('panel')}</button></div><div class="rail-body"><button class="new-work" data-action="new">${icon('plus')}新工作区<span>⌘ K</span></button><label class="search">${icon('search',14)}<input id="workspace-search" aria-label="搜索工作区" placeholder="搜索工作区…" value="${escapeHtml(s.search)}"><kbd>/</kbd></label><div class="section-label">项目 <span>${String(s.workspaces.length).padStart(2,'0')}</span></div><div class="repo-label">${icon('folder',15)}hifizz / pi-cloud-agents</div><div id="workspace-list">${rows||'<p class="empty">没有匹配的工作区</p>'}</div></div><div class="rail-footer"><span class="avatar">Z</span><span>个人工作台<small>本地原型 · 不连接云端</small></span><button class="icon-button" data-action="about" aria-label="关于原型">${icon('settings')}</button></div></aside>`;
}

/* components/header.mjs */
function PrototypeBar(s){return `<div class="prototype-bar"><span><span class="prototype-dot"></span>界面原型 <span class="muted">/</span> 演示数据</span><div class="scenarios" aria-label="演示场景">${[['running','执行中'],['approval','等待审批'],['review','待验收 · 后续']].map(([id,label])=>`<button data-action="scenario" data-id="${id}" aria-pressed="${s.scenario===id}" class="${s.scenario===id?'chosen':''}">${label}</button>`).join('')}</div><span class="tiny muted bar-note">M1 工作区探索</span></div>`;}
function Header(s){const v=statusInfo(s);return `<header class="main-header"><div class="header-title"><div class="title-line">${!s.railOpen?`<button class="icon-button" data-action="toggle-rail" aria-label="展开侧栏">${icon('panel')}</button>`:''}<span class="workspace-symbol">${icon('box',17)}</span><h1>${escapeHtml(s.workspace.name)}</h1></div><div class="breadcrumb"><span>pi-cloud-agents</span><span>/</span>${icon('branch',12)}<code>${escapeHtml(s.workspace.branch)}</code></div></div><button class="status-pill" data-action="environment" title="查看环境绑定"><span class="dot ${s.workspace.step<5?'warn':'ok'}"></span>${s.workspace.step<5?'准备中':'Sprite 就绪'}</button><button class="icon-button" data-action="toggle-panel" aria-label="切换右侧面板" aria-expanded="${s.panelOpen}">${icon('panel',18)}</button></header><div class="session-strip"><span>${icon('chat',13)}${escapeHtml(s.workspace.session||'主会话')}</span><span class="status-text ${v.tone}"><span class="dot ${v.tone}"></span>${v.label}</span><span class="tiny muted session-note">一个工作区 · 一个可写会话</span></div>`;}

/* components/panels.mjs */
const demoFiles=['web/src/lib/connection.ts','test/runner.test.mjs'];
function Panels(s){return `<aside class="right-panel"><div class="panel-tabs" role="tablist" aria-label="工作区面板">${[['changes','改动','file'],['files','文件','folder'],['terminal','终端','terminal'],['environment','环境','box']].map(([id,label,ic])=>`<button role="tab" aria-selected="${s.tab===id}" id="tab-${id}" aria-controls="panel-content" data-action="tab" data-id="${id}" class="${s.tab===id?'active':''}">${icon(ic,14)}${label}${id==='changes'?'<span class="tab-count">2</span>':''}</button>`).join('')}<button role="tab" aria-selected="false" disabled title="预览属于 M3 后续规划，当前不可用">预览<span class="tag">M3</span></button><button class="icon-button" data-action="toggle-panel" aria-label="关闭右侧面板">${icon('panel',15)}</button></div><div id="panel-content" role="tabpanel" aria-labelledby="tab-${s.tab}" class="panel-content">${s.tab==='environment'?Environment(s):s.tab==='terminal'?Terminal(s):s.tab==='files'?Files(s):Changes(s)}</div></aside>`;}
function Changes(s){return `<div class="panel-intro"><div class="eyebrow">本轮改动 <span class="tag">方案演示</span></div><p>M1 沿用会话工具改动；真实 Git 来源计划在 M2 接入。</p></div><div class="change-total"><strong>2 个文件</strong><span class="add">+28</span><span class="del">−7</span><button class="text-button" data-action="fold-diffs">${s.diffFolded?'全部展开':'全部折叠'}</button></div>${demoFiles.map((path,i)=>`<div class="diff-file"><button class="diff-title" data-action="diff-file" data-id="${i}" aria-expanded="${!s.diffFolded}">${icon('chevron',12)}<code>${path}</code><span class="add">+${i?16:12}</span><span class="del">−${i?0:7}</span></button>${!s.diffFolded?`<div class="diff-code" aria-label="${path} 的演示改动"><div class="diff-gap">@@ ${i?'+16 测试用例':'−42,7 +42,12'} @@</div>${(i?[[1,'neutral',"test('reconnect attaches to existing run',"],[2,'add','  async () => {'],[3,'add','    const run = await start(command);'],[4,'add','    await disconnect();'],[5,'add','    await reconnect(run.id);'],[6,'add','    assert.equal(processCount(), 1);'],[7,'add','  });']]:[[42,'neutral','async function reconnect(runId) {'],[43,'del','  return startExecution(command);'],[44,'add','  const run = await getRun(runId);'],[45,'add','  return attach(run, {'],[46,'add','    from: lastOutputOffset,'],[47,'add','  });'],[48,'neutral','}']]).map(([num,kind,line])=>`<div class="code-line ${kind}"><span>${num}</span><b>${kind==='add'?'+':kind==='del'?'−':' '}</b><code>${escapeHtml(line)}</code></div>`).join('')}</div>`:''}</div>`).join('')}<div class="panel-footnote">${icon('branch',13)}<span>${escapeHtml(s.workspace.branch)} → main</span></div>`;}
function Files(s){return `<div class="panel-intro"><div class="eyebrow">工作区文件 <span class="tag">结构示意</span></div><p>文件内容来自原型示例，不读取实际工作区。</p></div><div class="file-tree"><div class="tree-root">${icon('folder',14)}pi-cloud-agents</div>${['web/src/lib/connection.ts','test/runner.test.mjs','package.json','AGENTS.md'].map(path=>`<button data-action="file" data-id="${path}" class="${s.selectedFile===path?'selected':''}">${icon('file',13)}<code>${path}</code>${demoFiles.includes(path)?'<span class="add">M</span>':''}</button>`).join('')}</div><div class="file-preview"><div class="eyebrow">${escapeHtml(s.selectedFile)}</div><pre>${escapeHtml(s.selectedFile==='package.json'?'{\n  "name": "pi-cloud-agents",\n  "type": "module"\n}':s.selectedFile==='AGENTS.md'?'# Agent guide\n\n演示摘录：\n每个工作区绑定独立 Sprite。':s.selectedFile.includes('test/')?"test('reconnect attaches to existing run',\n  async () => {\n    await reconnect(existingRun.id);\n    assert.equal(processCount(), 1);\n  });":'// 示例文件 · 非实际源码\nexport async function reconnect(runId) {\n  const run = await getRun(runId);\n  return attach(run, {\n    from: lastOutputOffset,\n  });\n}')}</pre></div>`;}
function Terminal(s){return `<div class="terminal-meta"><span class="dot ${s.scenario==='running'?'accent':'muted'}"></span><code>run · demo-a84f</code><span class="tag">只读演示</span></div><div class="terminal-output" role="log" aria-label="演示终端日志"><p class="muted">~/workspace · ${escapeHtml(s.workspace.branch)}</p><pre>$ npm test\n\n<span class="muted">[演示日志] 正在接回已有执行 demo-a84f</span>\n<span class="ok">✓</span> runner preserves execution id\n<span class="ok">✓</span> reconnect resumes output offset\n<span class="ok">✓</span> duplicate execution prevented\n\n${s.scenario==='running'?'<span class="muted">… running regression suite</span>':s.scenario==='stopping'?'<span class="warn">stop requested · awaiting confirmation</span>':s.scenario==='review'?'<span class="ok">12 tests passed · 演示结果</span>':'<span class="muted">日志流暂停 · 本地示例</span>'}</pre></div><div class="terminal-bottom">${icon('terminal',14)}<span>直接输入 / 人工接管</span><span class="tag">M2 后续规划</span></div>`;}
function Environment(s){return `<div class="panel-intro"><div class="eyebrow">独立执行环境 <span class="tag">M1</span></div><p>每个工作区绑定一台 Sprite，代码与执行相互隔离。</p></div><div class="environment-card"><div class="card-heading">${icon('box',18)}<strong>Sprites</strong><span class="status-pill"><span class="dot ${s.workspace.step<5?'warn':'ok'}"></span>${s.workspace.step<5?'准备中':'可用'}</span></div><dl><dt>实例</dt><dd>${escapeHtml(s.workspace.sprite)}</dd><dt>绑定版本</dt><dd>v1 <span class="muted">· 当前</span></dd><dt>工作目录</dt><dd>/home/sprite/workspace</dd><dt>工作分支</dt><dd>${escapeHtml(s.workspace.branch)}</dd><dt>模型</dt><dd>${escapeHtml(s.model)}</dd></dl></div><div class="panel-section-title"><h2>代码检查点</h2><span class="tag">M1 · 手动</span><button data-action="checkpoint" ${s.workspace.step<5?'disabled title="环境就绪后可保存"':''}>${icon('save',13)}保存（模拟）</button></div><p class="panel-description">保存未提交代码，用于在新环境中恢复。忽略文件不包含在内。</p><div class="checkpoint-list">${s.checkpoints.map((cp,i)=>`<div class="checkpoint"><span class="checkpoint-dot">${icon('save',13)}</span><div><strong>${escapeHtml(cp.title)}</strong><small>${escapeHtml(cp.time)} · ${escapeHtml(cp.detail)}</small></div><button data-action="checkpoint-info" data-id="${i}" aria-label="查看检查点 ${escapeHtml(cp.title)}">${icon('chevron',13)}</button></div>`).join('')}</div><div class="environment-note">${icon('refresh',14)}<span>刷新或重新打开页面时接回同一执行，初始化从已完成步骤继续。</span></div>`;}

/* components/new-workspace-dialog.mjs */
function NewWorkspaceDialog(s){return `<dialog id="new-workspace-dialog" aria-labelledby="dialog-title"><form id="new-workspace-form"><div class="dialog-header"><div><span class="eyebrow">开始一项独立工作</span><h2 id="dialog-title">新建工作区</h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭对话框">${icon('close',19)}</button></div><p class="dialog-desc">选择仓库，准备一个独立 Sprite，然后让 Agent 开始工作。</p><div class="form-row"><label>仓库<select name="repo" required><option value="hifizz/pi-cloud-agents">hifizz / pi-cloud-agents</option><option value="hifizz/tars-sandbox-playground">hifizz / tars-sandbox-playground</option></select></label><label>基准分支<input name="baseBranch" value="main" required></label></div><label>工作区名称<input name="name" placeholder="例如：修复预览断连" required maxlength="60"></label><label>需求<textarea name="task" rows="3" required placeholder="希望 Agent 完成什么？可描述问题、预期行为与验证方式。" maxlength="4000"></textarea></label><label>执行环境<select name="provider"><option>Sprites · 独立云环境</option></select></label><details class="advanced"><summary>${icon('settings',14)}更多设置<span>安装命令与模型</span></summary><div><label>安装命令<input name="installCommand" value="npm ci" maxlength="200"><small>仅作原型记录，不执行命令</small></label><label>模型<select name="model">${modelOptions.map(m=>`<option ${m===s.model?'selected':''}>${m}</option>`).join('')}</select></label></div></details><p id="form-error" class="form-error" role="alert"></p><div class="dialog-footer"><span class="tiny muted">本地模拟 · 不创建真实云资源</span><button type="button" data-action="close-dialog">取消</button><button type="submit" class="primary">创建工作区 ${icon('arrow',14)}</button></div></form></dialog>`;}

/* components/layout.mjs */
function Layout(s){return `${PrototypeBar(s)}<div class="workspace-shell ${s.railOpen?'':'rail-closed'} ${s.panelOpen?'':'panel-closed'}">${s.overlay?'<button class="scrim" data-action="close-overlays" aria-label="关闭浮层" tabindex="-1"></button>':''}${s.railOpen?Sidebar(s):''}<main class="main" aria-label="工作区对话">${Header(s)}${Conversation(s)}${Composer(s)}</main>${s.panelOpen?Panels(s):''}</div><div id="toast" class="toast" role="status" aria-live="polite"></div>${NewWorkspaceDialog(s)}`;}

/* app.mjs */
const workspaces=[{id:'preview',name:'修复预览断连',session:'修复与验证',branch:'tarsbot/fix-preview',sprite:'pca-7e4a9c12b0',step:5,model:'SWE-2'},{id:'upload',name:'补齐上传校验',session:'补齐校验',branch:'tarsbot/upload-check',sprite:'pca-2b6d8f34a1',step:5,model:'GLM 5.3',task:'补齐上传文件类型和大小校验，给出清晰的错误提示，并补上边界用例。'}];
const state={workspaces,active:'preview',workspace:workspaces[0],scenario:'running',railOpen:!matchMedia('(max-width:820px)').matches,panelOpen:!matchMedia('(max-width:1180px)').matches,overlay:false,tab:'changes',search:'',toolsOpen:false,diffFolded:false,selectedFile:'web/src/lib/connection.ts',draft:'',model:'SWE-2',messages:[],checkpoints:[{title:'开始修复前',time:'今天 14:31',detail:'初始代码 · 演示检查点'}],testsStale:false,prCreated:false};
const app=document.querySelector('#app');
let toastTimer,returnFocus;
const narrowRail=()=>matchMedia('(max-width:820px)').matches;
const narrowPanel=()=>matchMedia('(max-width:1180px)').matches;
// 窄屏时侧栏与面板都是浮层，同一时间只开一个，避免互相叠压。
function settleOverlays(opened){if(opened==='rail'&&state.railOpen&&narrowRail())state.panelOpen=false;if(opened==='panel'&&state.panelOpen&&narrowRail())state.railOpen=false;}
function render({scroll=false}={}){state.overlay=(state.railOpen&&narrowRail())||(state.panelOpen&&narrowPanel());const pos=app.querySelector('.conversation')?.scrollTop||0;app.innerHTML=Layout(state);const feed=app.querySelector('.conversation');feed.scrollTop=scroll?feed.scrollHeight:pos;}
function toast(text){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=text;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),4200);}
function openDialog(){returnFocus=document.activeElement;document.querySelector('#new-workspace-dialog').showModal();document.querySelector('[name=name]').focus();}
function closeDialog(){document.querySelector('#new-workspace-dialog').close();returnFocus?.focus();}
function scenario(id){if(state.workspace.step<5){toast('请先用“下一步”完成工作区初始化演示');return;}state.scenario=id;state.testsStale=false;state.prCreated=false;render();}
function send(mode){if(!state.draft.trim()||state.workspace.step<5)return;if(state.scenario==='approval'){toast('请先批准或拒绝当前操作，再补充需求');return;}state.messages.push({text:state.draft.trim(),mode});state.draft='';if(state.scenario==='review')state.testsStale=true;render({scroll:true});document.querySelector('#message-input').focus();}
app.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const {action,id}=button.dataset;
 switch(action){
 case 'new':openDialog();break;
 case 'close-dialog':closeDialog();break;
 case 'toggle-rail':state.railOpen=!state.railOpen;settleOverlays('rail');render();break;
 case 'toggle-panel':state.panelOpen=!state.panelOpen;settleOverlays('panel');render();break;
 case 'close-overlays':if(narrowRail())state.railOpen=false;if(narrowPanel())state.panelOpen=false;render();break;
 case 'tab':state.tab=id;render();document.querySelector(`#tab-${id}`).focus();break;
 case 'environment':case 'terminal':case 'changes':state.tab=action;state.panelOpen=true;settleOverlays('panel');render();break;
 case 'scenario':scenario(id);break;
 case 'tools':state.toolsOpen=!state.toolsOpen;render();break;
 case 'fold-diffs':case 'diff-file':state.diffFolded=!state.diffFolded;render();break;
 case 'file':state.selectedFile=id;render();break;
 case 'workspace':if(state.active===id)break;Object.assign(state.workspace,{messages:state.messages,draft:state.draft,scenario:state.scenario,checkpoints:state.checkpoints,testsStale:state.testsStale,prCreated:state.prCreated});if(narrowRail())state.railOpen=false;state.active=id;state.workspace=state.workspaces.find(w=>w.id===id);Object.assign(state,{model:state.workspace.model,messages:state.workspace.messages||[],draft:state.workspace.draft||'',scenario:state.workspace.scenario||'running',checkpoints:state.workspace.checkpoints||[],testsStale:state.workspace.testsStale||false,prCreated:state.workspace.prCreated||false});render();break;
 case 'session':toast('当前会话已打开；M1 每个工作区只有一个可写会话');break;
 case 'send':send(['running','stopping','approval'].includes(state.scenario)?'补充本轮':'继续工作');break;
 case 'queue':send('下一轮');break;
 case 'stop':state.scenario='stopping';render();toast('已发送停止请求（模拟），尚未收到执行端确认');break;
 case 'confirm-stop':state.scenario='stopped';render();toast('已收到停止确认 · 本地模拟');break;
 case 'approve':state.scenario='running';render();toast('审批已批准（模拟），任务继续；未执行真实推送');break;
 case 'reject':state.scenario='denied';render();toast('已拒绝本次推送（模拟）');break;
 case 'rerun':state.testsStale=false;render();toast('已更新演示测试结果 · 未运行真实测试');break;
 case 'pr':if(state.testsStale){toast('补充需求后，先重新验证再创建示例 PR');break;}state.prCreated=true;render();toast('示例 PR：修复预览断连 · 未访问 GitHub');break;
 case 'checkpoint':state.checkpoints.unshift({title:`手动检查点 ${state.checkpoints.length+1}`,time:'刚刚',detail:'2 个文件 · 本地模拟'});render();toast('演示检查点已保存；没有读取或存档实际文件');break;
 case 'checkpoint-info':toast(`${state.checkpoints[Number(id)].title}：保存未提交代码，恢复操作由后端接入后提供`);break;
 case 'init-next':state.workspace.step++;render();if(state.workspace.step===5)toast('工作区就绪（模拟），需求已交给 Agent');break;
 case 'about':toast('组件化界面原型 · 无外部依赖 · 所有操作仅保存在本页内存');break;
 }
});
app.addEventListener('input',event=>{if(event.target.id==='message-input'){state.draft=event.target.value;document.querySelectorAll('[data-action=send],[data-action=queue]').forEach(b=>b.disabled=!state.draft.trim());}if(event.target.id==='workspace-search'){state.search=event.target.value;const temporary=document.createElement('div');temporary.innerHTML=Sidebar(state);document.querySelector('#workspace-list').innerHTML=temporary.querySelector('#workspace-list').innerHTML;}});
app.addEventListener('change',event=>{if(event.target.id==='model-select'){state.model=event.target.value;state.workspace.model=state.model;render();toast(`已切换为 ${state.model} · 本地模拟`);}});
app.addEventListener('keydown',event=>{if(event.target.id==='message-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send(['running','stopping','approval'].includes(state.scenario)?'补充本轮':'继续工作');}if(event.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const tabs=['changes','files','terminal','environment'];const index=tabs.indexOf(state.tab);state.tab=tabs[(index+(event.key==='ArrowRight'?1:3))%4];render();document.querySelector(`#tab-${state.tab}`).focus();}});
app.addEventListener('submit',event=>{if(event.target.id!=='new-workspace-form')return;event.preventDefault();const form=event.target;if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));if(!values.name.trim()||!values.task.trim()){document.querySelector('#form-error').textContent='工作区名称和需求不能只包含空格。';return;}if(/\s/.test(values.baseBranch)||values.baseBranch.includes('..')||values.baseBranch.endsWith('/')||values.baseBranch.includes('//')){document.querySelector('#form-error').textContent='请输入合法的基准分支名称。';return;}Object.assign(state.workspace,{messages:state.messages,draft:state.draft,scenario:state.scenario,checkpoints:state.checkpoints,testsStale:state.testsStale,prCreated:state.prCreated});const suffix=String(Date.now()).slice(-6);const workspace={id:`local-${suffix}`,name:values.name.trim(),branch:`tarsbot/work-${suffix}`,sprite:`pca-demo-${suffix}`,step:0,model:values.model,task:values.task.trim(),repo:values.repo,baseBranch:values.baseBranch,installCommand:values.installCommand};state.workspaces.push(workspace);Object.assign(state,{active:workspace.id,workspace,scenario:'running',model:workspace.model,messages:[],draft:'',checkpoints:[],testsStale:false,prCreated:false,search:''});if(narrowRail())state.railOpen=false;render();document.querySelector('[data-action=init-next]').focus();toast('工作区已在本页创建，用“下一步”推进初始化演示');});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!document.querySelector('dialog[open]'))openDialog();}if(event.key==='/'&&!event.target.matches('input,textarea,select')){event.preventDefault();if(!state.railOpen){state.railOpen=true;render();}document.querySelector('#workspace-search').focus();}});
render();
</script></body></html>
