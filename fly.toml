app = "pi-cloud-agents"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]

[env]
  TARSBOT_HOST = "0.0.0.0"
  TARSBOT_PORT = "8080"
  TARSBOT_DATA_DIR = "/data"
  TARSBOT_PUBLIC_URL = "https://pi.zilin.im"
  TARSBOT_ALLOWED_EMAILS = "stackfizztailan@gmail.com,fizzstack@gmail.com"
  TARSBOT_SPRITE_NAME = "pi-cloud-agents"
  NODE_ENV = "production"

[deploy]
  # Single machine + single-writer sqlite on one volume: "immediate" replaces the
  # machine in place. rolling/bluegreen would need a second machine (and a second
  # volume / concurrent writers), which this app cannot support.
  strategy = "immediate"

[[mounts]]
  source = "pi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
